services:
  - type: web
    name: primal-api
    runtime: node
    plan: free
    region: singapore
    rootDir: api
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SHIPROCKET_EMAIL
        sync: false
      - key: SHIPROCKET_PASSWORD
        sync: false
      - key: SHIPROCKET_PICKUP_PINCODE
        sync: false
      - key: SHIPROCKET_PICKUP_LOCATION
        value: Primary
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://primalnutrition.in,https://www.primalnutrition.in,https://primal-revamp-v2.netlify.app,https://primal-admin.netlify.app,http://localhost:5002,http://localhost:5173
